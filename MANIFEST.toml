long_description = """
Adds Discogs as a metadata source next to MusicBrainz, for the releases
MusicBrainz covers thinly — specific pressings, small labels, reissues and
box sets.

**Choosing a release.** Searching Discogs opens a sortable table, not
the top hit: year, country, medium, edition, label, catalogue number and
have/want counts, with a Match column saying which facts agreed. Search by
any field, or paste a release ID or URL.

**Reads your copy.** The album's folder says which pressing you own:
catalogue numbers in its name, rip logs and cue sheets whose disc ID fits your
files, a pressing year, a vinyl or SACD rip, and the barcode and codes printed
on your scans and PDF booklets (OCR, on your system's Python). Discogs is
searched by these first and scored by TagMender's pressing scorer; a release
is applied on its own only when your copy proves it, MusicBrainz links it, or
it carries the matched release's barcode, with nothing of your copy against
it. Otherwise the release picker asks you, one album at a time.

**The web, off by default.** Empty genres and credits, cover art, lyrics and
albums no database has, from Deezer, iTunes, Bandcamp, Wikipedia, VGMdb and
LRCLIB, each only when every track's length fits your files.

**Album artist and editions as TagMender writes them.** The lead artist
alone, a band named after a member under that member; [2004 Remaster],
[Vinyl Rip], [SACD] in the Album tag; HD, vinyl and tape rips in Grouping.

**Four tag sources.** Discogs only, MusicBrainz only, Discogs preferred, or
MusicBrainz preferred. Each is exact about what it overwrites and what it
leaves alone, and single-valued fields never get two sources concatenated
into one tag.

**Box sets.** Maps Picard's discs onto Discogs', with manual override.

**Cover art** (front, front+back or every image) and a troubleshooting log.

Requires a free Discogs personal access token, set under
Options → Plugins → Discogs Enrichment.
"""
